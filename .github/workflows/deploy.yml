name: Deploy to Hostinger (Simple)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql

      - name: Install PHP deps
        run: composer install --no-dev --optimize-autoloader

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node deps
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Remove dev files
        run: |
          rm -rf node_modules
          rm -rf .git .github .env .env.example .env.prod

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete --exclude='storage' --exclude='.env'
          path: .
          remote_path: /home/${{ secrets.SSH_USER }}/domains/gateglobal.io/public_html
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
          remote_port: ${{ secrets.SSH_PORT }}

      - name: Post-deploy (artisan)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/domains/gategglobal.io/public_html
            mkdir -p storage/framework/views storage/framework/cache storage/framework/sessions storage/logs
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
