name: Deploy to Hostinger (Releases + Rollback)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql

      - name: Install PHP deps
        run: composer install --no-dev --optimize-autoloader

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node deps
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Remove dev files
        run: |
          rm -rf node_modules
          rm -rf .git .github .env .env.example .env.prod

      - name: Deploy release via rsync
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete --exclude='storage'
          path: .
          remote_path: /home/${{ secrets.SSH_USER }}/gateglobal.io/releases/${{ github.run_id }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
          remote_port: ${{ secrets.SSH_PORT }}

      - name: Finalize release (symlinks + migrate)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            BASE=/home/${{ secrets.SSH_USER }}/gateglobal.io
            RELEASE=$BASE/releases/${{ github.run_id }}

            mkdir -p $BASE/shared/storage/framework/views
            mkdir -p $BASE/shared/storage/framework/cache
            mkdir -p $BASE/shared/storage/framework/sessions
            mkdir -p $BASE/shared/storage/logs

            ln -nfs $BASE/shared/.env $RELEASE/.env
            ln -nfs $BASE/shared/storage $RELEASE/storage
            mkdir -p $RELEASE/bootstrap/cache

            ln -nfs $RELEASE $BASE/current
            rm -rf $BASE/public_html/*
            ln -s $BASE/current/public/* $BASE/public_html/

            cd $BASE/current
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

      - name: Cleanup old releases (keep last 5)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/gateglobal.io/releases
            ls -1dt */ | tail -n +6 | xargs -r rm -rf
